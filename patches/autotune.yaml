output: /usr/bin/autotune.sh
categories: 
  - networking
  - performance
mode: overwrite
commentCharacter: "#"
commandsAfter: 
  - chmod +x /usr/bin/autotune.sh
  - |
    # Create systemd service to run autotune.sh after sysctl.conf is loaded
    # This ensures autotune.sh runs AFTER systemd-sysctl.service, so dynamic values override static ones
    SERVICE_FILE="/etc/systemd/system/autotune.service"
    SERVICE_DIR="/etc/systemd/system"
    
    # Create service file
    cat > "$SERVICE_FILE" << 'EOFSERVICE'
    [Unit]
    Description=Dynamic kernel parameter tuning based on RAM
    After=systemd-sysctl.service network-online.target
    Requires=systemd-sysctl.service
    Wants=network-online.target
    # Ensure this runs after all sysctl operations are complete
    After=sysctl.service
    
    [Service]
    Type=oneshot
    # Explicitly run as root (default, but making it clear for sysctl -w)
    User=root
    Group=root
    ExecStart=/usr/bin/autotune.sh
    RemainAfterExit=yes
    StandardOutput=journal
    StandardError=journal

    
    [Install]
    WantedBy=multi-user.target
    EOFSERVICE
    
    # Reload systemd and enable service
    systemctl daemon-reload
    # --now, not bare enable: the RAM-derived ceilings and the NET_RX defaults only
    # land at the next reboot otherwise, while sysctl.yaml has already applied the
    # static file. That gap is why hosts kept conntrack at 8192 for months.
    systemctl enable --now autotune.service
description:
  configure conntrack_max, tcp_max_tw_buckets, and fs.file-max dynamically based on available RAM, and restore the kernel NET_RX defaults (net.core.netdev_budget{,_usecs}) whose correct value depends on CONFIG_HZ. creates script in /usr/bin/autotune.sh and creates systemd service that runs after sysctl.conf is loaded to ensure dynamic values override static ones.
body: |
  #!/usr/bin/env bash

  set -euo pipefail

  # PATCHFILES START - autotune configuration
  # Ensure we're running as root (required for sysctl -w)
  if [ "$EUID" -ne 0 ]; then
      echo "Error: This script must be run as root" >&2
      exit 1
  fi
  # Minimum number of conntrack entries
  MIN_CONNTRACK=65536

  # Number of entries per 1 GB RAM (e.g., 65536 => 8 GB ≈ 524288)
  PER_GB=65536

  # Extract total RAM in kB (MemTotal = total installed RAM, not free RAM)
  MEM_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
  
  # Debug: Show what we're reading
  echo "Debug: MemTotal from /proc/meminfo = ${MEM_KB} kB"

  # Convert to GB and round up to nearest whole number (e.g., 3.8GB -> 4GB)
  # Using ceil logic: if there's any decimal part, round up
  RAM_GB=$(awk "BEGIN {ram_gb = $MEM_KB / 1024 / 1024; print (ram_gb == int(ram_gb)) ? int(ram_gb) : int(ram_gb) + 1}")
  [ "$RAM_GB" -lt 1 ] && RAM_GB=1
  
  echo "Debug: Calculated RAM_GB = ${RAM_GB} GB (rounded up from $(awk "BEGIN {printf \"%.2f\", $MEM_KB / 1024 / 1024}") GB)"

  # Calculate desired limit
  TARGET_MAX=$((RAM_GB * PER_GB))

  # Apply minimum limit
  if [ "$TARGET_MAX" -lt "$MIN_CONNTRACK" ]; then
      TARGET_MAX=$MIN_CONNTRACK
  fi

  # ============================================================================
  # SECTION: Set conntrack_max
  # ============================================================================
  SYSCTL_KEY="net.netfilter.nf_conntrack_max"
  
  # Load nf_conntrack module if not already loaded
  if ! lsmod | grep -q "^nf_conntrack "; then
      echo "Loading nf_conntrack module..."
      if modprobe nf_conntrack 2>/dev/null; then
          # Wait a moment for module to fully initialize and create sysctl parameters
          sleep 1
          echo "nf_conntrack module loaded successfully"
      else
          echo "Warning: Could not load nf_conntrack module. Skipping conntrack_max setting."
          SYSCTL_KEY=""
      fi
  fi
  
  # Only set conntrack_max if parameter exists (module is loaded)
  if [ -n "$SYSCTL_KEY" ] && [ -f "/proc/sys/net/netfilter/nf_conntrack_max" ]; then
      CURRENT=$(sysctl -n "$SYSCTL_KEY" 2>/dev/null || echo 0)
      if [ "$CURRENT" -ne "$TARGET_MAX" ]; then
          echo "Setting $SYSCTL_KEY=$TARGET_MAX (RAM=${RAM_GB}G, was=$CURRENT)"
          sysctl -w "$SYSCTL_KEY=$TARGET_MAX" >/dev/null
      else
          echo "$SYSCTL_KEY already $CURRENT, nothing to do."
      fi
  elif [ -n "$SYSCTL_KEY" ]; then
      echo "Warning: nf_conntrack_max parameter not available even after loading module. Module may not be supported on this system."
  fi

  # ============================================================================
  # SECTION: Set tcp_max_tw_buckets
  # ============================================================================
  # Should match or be close to conntrack_max
  TCP_MAX_TW_KEY="net.ipv4.tcp_max_tw_buckets"
  TCP_MAX_TW_CURRENT=$(sysctl -n "$TCP_MAX_TW_KEY" 2>/dev/null || echo 0)
  if [ "$TCP_MAX_TW_CURRENT" -ne "$TARGET_MAX" ]; then
      echo "Setting $TCP_MAX_TW_KEY=$TARGET_MAX (RAM=${RAM_GB}G, was=$TCP_MAX_TW_CURRENT)"
      sysctl -w "$TCP_MAX_TW_KEY=$TARGET_MAX" >/dev/null
  else
      echo "$TCP_MAX_TW_KEY already $TCP_MAX_TW_CURRENT, nothing to do."
  fi

  # ============================================================================
  # SECTION: Set fs.file-max
  # ============================================================================
  # Formula: RAM_GB * 262144 (e.g., 8 GB = 2097152)
  FILE_MAX_PER_GB=262144
  FILE_MAX_TARGET=$((RAM_GB * FILE_MAX_PER_GB))
  FILE_MAX_MIN=1048576
  if [ "$FILE_MAX_TARGET" -lt "$FILE_MAX_MIN" ]; then
      FILE_MAX_TARGET=$FILE_MAX_MIN
  fi

  FILE_MAX_KEY="fs.file-max"
  FILE_MAX_CURRENT=$(sysctl -n "$FILE_MAX_KEY" 2>/dev/null || echo 0)
  if [ "$FILE_MAX_CURRENT" -ne "$FILE_MAX_TARGET" ]; then
      echo "Setting $FILE_MAX_KEY=$FILE_MAX_TARGET (RAM=${RAM_GB}G, was=$FILE_MAX_CURRENT)"
      sysctl -w "$FILE_MAX_KEY=$FILE_MAX_TARGET" >/dev/null
  else
      echo "$FILE_MAX_KEY already $FILE_MAX_CURRENT, nothing to do."
  fi
  # ============================================================================
  # SECTION: Restore the NET_RX softirq defaults
  # ============================================================================
  # sysctl.yaml used to ship netdev_budget=30000 / netdev_budget_usecs=6000.
  # The budget could never bind -- net_rx_action() drains at most (NAPI instances
  # on that CPU) * NAPI_POLL_WEIGHT(64) packets per round, so a typical host tops
  # out at 128 and would need 469 NAPI instances for 30000 to matter.
  # The usecs value is the one that bit: it bounds how long one NET_RX round holds
  # a CPU with preemption disabled. The kernel default is 2 * USEC_PER_SEC / HZ, so
  # 6000 was a 3x longer window at HZ=1000 and BELOW the default at HZ=250, where
  # v6.14+ refuses it outright. That is why this is computed here and not a static
  # line: removing the line does not reset a running host either.
  NETDEV_HZ=$(awk -F= '/^CONFIG_HZ=[0-9]/{print $2; exit}' "/boot/config-$(uname -r)" 2>/dev/null)
  if [ -z "$NETDEV_HZ" ]; then
      NETDEV_HZ=$(zcat /proc/config.gz 2>/dev/null | awk -F= '/^CONFIG_HZ=[0-9]/{print $2; exit}')
  fi
  # Unknown -> assume the finest tick. Guessing high can only produce a write the
  # kernel refuses, leaving its own default. Guessing low installs a real window.
  case "$NETDEV_HZ" in ''|*[!0-9]*) NETDEV_HZ=1000 ;; esac
  NETDEV_USECS=$(( 2 * 1000000 / NETDEV_HZ ))

  NETDEV_BUDGET_CURRENT=$(sysctl -n net.core.netdev_budget 2>/dev/null || echo 0)
  if [ "$NETDEV_BUDGET_CURRENT" -ne 300 ]; then
      echo "Setting net.core.netdev_budget=300 (kernel default, was=$NETDEV_BUDGET_CURRENT)"
      sysctl -w net.core.netdev_budget=300 >/dev/null
  else
      echo "net.core.netdev_budget already 300, nothing to do."
  fi

  NETDEV_USECS_CURRENT=$(sysctl -n net.core.netdev_budget_usecs 2>/dev/null || echo 0)
  if [ "$NETDEV_USECS_CURRENT" -ne "$NETDEV_USECS" ]; then
      echo "Setting net.core.netdev_budget_usecs=$NETDEV_USECS (2 jiffies at HZ=$NETDEV_HZ, was=$NETDEV_USECS_CURRENT)"
      sysctl -w "net.core.netdev_budget_usecs=$NETDEV_USECS" >/dev/null 2>&1 || \
          echo "Warning: kernel refused netdev_budget_usecs=$NETDEV_USECS; left at $NETDEV_USECS_CURRENT"
  else
      echo "net.core.netdev_budget_usecs already $NETDEV_USECS_CURRENT, nothing to do."
  fi
  # ============================================================================
  # SECTION: Maximize NIC ring buffers
  # ============================================================================
  # Ring buffers are hardware-dependent (ethtool, not sysctl), so we detect
  # max values at boot and set accordingly for each active interface.
  for IFACE in $(ip -o link show up | awk -F': ' '{print $2}' | grep -vE '^(lo|docker|br-|veth|tap|virbr)'); do
      RX_MAX=$(ethtool -g "$IFACE" 2>/dev/null | awk '/Pre-set/,/Current/' | awk '/^RX:/{print $2}' | head -1)
      RX_CUR=$(ethtool -g "$IFACE" 2>/dev/null | awk '/Current/,0' | awk '/^RX:/{print $2}' | head -1)
      TX_MAX=$(ethtool -g "$IFACE" 2>/dev/null | awk '/Pre-set/,/Current/' | awk '/^TX:/{print $2}' | head -1)

      if [ -n "$RX_MAX" ] && [ -n "$RX_CUR" ] && [ "$RX_CUR" -lt "$RX_MAX" ] 2>/dev/null; then
          echo "Setting $IFACE ring buffer RX=$RX_MAX TX=$TX_MAX (was RX=$RX_CUR)"
          ethtool -G "$IFACE" rx "$RX_MAX" tx "${TX_MAX:-$RX_MAX}" 2>/dev/null || true
      else
          echo "$IFACE ring buffer already at max ($RX_CUR), nothing to do."
      fi
  done
  # PATCHFILES END - autotune configuration

