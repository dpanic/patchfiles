name: Release

# Every push to main cuts a full release: bump the semver from conventional
# commits, run the generator to produce patch.sh/revert.sh, and publish them
# as GitHub Release assets (the README installs from releases/latest/download).
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Compute the next version from conventional-commit history since the
      # latest tag: feat -> minor, "!"/BREAKING CHANGE -> major, else patch.
      # patchfiles tags have no "v" prefix (e.g. 1.7.1). Pure git, no action.
      - name: Compute next version
        id: tag
        run: |
          set -euo pipefail
          latest="$(git tag --list --sort=-v:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          if [ -z "$latest" ]; then
            prefix=""; major=0; minor=0; patch=0; range=""
          else
            case "$latest" in v*) prefix="v"; core="${latest#v}";; *) prefix=""; core="$latest";; esac
            major="${core%%.*}"; rest="${core#*.}"; minor="${rest%%.*}"; patch="${rest#*.}"
            range="${latest}..HEAD"
          fi
          subjects="$(git log --format='%s' ${range:+$range})"
          bodies="$(git log --format='%B' ${range:+$range})"
          if printf '%s\n' "$subjects" | grep -qE '^[a-z]+(\([^)]+\))?!:' \
             || printf '%s\n' "$bodies" | grep -qE '^BREAKING[ -]CHANGE:'; then
            major=$((major+1)); minor=0; patch=0
          elif printf '%s\n' "$subjects" | grep -qE '^feat(\([^)]+\))?:'; then
            minor=$((minor+1)); patch=0
          else
            patch=$((patch+1))
          fi
          new_version="${major}.${minor}.${patch}"
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"
          echo "new_tag=${prefix}${new_version}" >> "$GITHUB_OUTPUT"
          echo "Next release: ${prefix}${new_version}"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      # VERSION is stamped into the generated script header (generator/header.go).
      - name: Generate patch/revert scripts
        env:
          VERSION: ${{ steps.tag.outputs.new_version }}
          AUTHOR: dpanic@gmail.com
          ENVIRONMENT: prod
        run: go run .

      # Create the tag on HEAD, then publish the release with the scripts.
      - name: Create and push tag
        run: |
          git tag "${{ steps.tag.outputs.new_tag }}"
          git push origin "${{ steps.tag.outputs.new_tag }}"

      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          artifacts: "patch.sh,revert.sh"
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
