name: Release

# Every push to main cuts a full release: bump the semver from conventional
# commits, run the generator to produce patch.sh/revert.sh, and publish them
# as GitHub Release assets (the README installs from releases/latest/download).
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Bump from the latest tag using conventional-commit prefixes.
      # tag_prefix is empty because patchfiles tags have no "v" (e.g. 1.7.1).
      # Creates and pushes the tag; outputs new_version / new_tag / changelog.
      - name: Compute next version
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: ""

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      # VERSION is stamped into the generated script header (generator/header.go).
      - name: Generate patch/revert scripts
        env:
          VERSION: ${{ steps.tag.outputs.new_version }}
          AUTHOR: dpanic@gmail.com
          ENVIRONMENT: prod
        run: go run .

      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          artifacts: "patch.sh,revert.sh"
          body: ${{ steps.tag.outputs.changelog }}
          token: ${{ secrets.GITHUB_TOKEN }}
